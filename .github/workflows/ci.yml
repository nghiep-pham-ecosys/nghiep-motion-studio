# CI for nghiep-motion-studio. Actions pinned by commit SHA; gitleaks from its release tarball checked by sha256.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  VHS_VERSION: 0.12.1
  VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10
  TTYD_VERSION: 1.7.7
  TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No rendered media committed
        run: |
          set -euo pipefail
          big="$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 2048 {print $2}')"
          if [ -n "${big}" ]; then
            echo "::error::files over 2 MB are not allowed (render output stays out of git):"
            printf '%s\n' "${big}"
            exit 1
          fi
          echo "OK: no tracked file over 2 MB"

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg, fonts and the Manim build libraries
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core fonts-dejavu-mono \
            libcairo2-dev libpango1.0-dev pkg-config
          ffmpeg -hide_banner -version | head -n 1
      - name: Install VHS and ttyd (release binaries checked by sha256)
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/vhs"
          mkdir -p "${dir}/bin"
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "${dir}/${tarball}" "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}"
          install -m 755 "${dir}/vhs_${VHS_VERSION}_Linux_x86_64/vhs" "${dir}/bin/vhs"
          curl -fsSL --retry 3 -o "${dir}/ttyd" "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  ${dir}/ttyd" | sha256sum -c -
          install -m 755 "${dir}/ttyd" "${dir}/bin/ttyd"
          echo "${dir}/bin" >> "${GITHUB_PATH}"
          command -v google-chrome
      - name: Install the package with Manim
        run: python3 -m pip install --disable-pip-version-check -e '.[visuals]'
      - name: Visual adapters
        run: motion-studio tools
      - name: Validate samples
        run: motion-studio validate samples/*/scenes.json
      - name: Run tests
        env:
          MOTION_STUDIO_REQUIRE_FFMPEG: "1"
          MOTION_STUDIO_REQUIRE_MANIM: "1"
          MOTION_STUDIO_REQUIRE_VHS: "1"
          # ubuntu-24.04 blocks the Chrome sandbox (no unprivileged user namespaces).
          VHS_NO_SANDBOX: "true"
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${tarball}" "${base}/${tarball}"
          curl -fsSL --retry 3 -o "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -qx "${GITLEAKS_SHA256}  ${tarball}" "${dir}/checksums.txt"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v .

  ci-result:
    name: ci-result
    if: always()
    needs: [docs, tests, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "${NEEDS}" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null; then
            echo "::error::ci-result fails because at least one job did not succeed"
            exit 1
          fi
