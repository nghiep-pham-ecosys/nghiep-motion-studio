[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nghiep-motion-studio"
version = "0.1.0"
description = "Scene-based explainer video pipeline: scenes.json to 1080p mp4 with ffmpeg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.10"]

[project.optional-dependencies]
# Local TTS engines. Install torch first from the PyTorch CUDA index (see `just tts-setup` and docs/voices.md).
tts = [
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "vieneu==3.8.4",
    "transformers==4.57.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper==1.2.1",
]
# The English clone engine (clone-en): Chatterbox, MIT code and weights. It pins torch 2.6 and transformers 5.2,
# which clash with the tts extra, so install it in its own venv (`just clone-en-setup` uses torch 2.11 instead).
clone-en = ["chatterbox-tts==0.1.7", "resemble-perth==1.0.1", "s3tokenizer==0.3.0", "huggingface_hub>=0.30"]
# Manim CE for the manim, diagram and code visual kinds. Linux builds it from source:
# install libcairo2-dev, libpango1.0-dev and pkg-config first.
visuals = ["manim==0.22.1"]
# faster-whisper for the subtitle drift check and alignment (MIT; models go to the Hugging Face cache).
subtitles = ["faster-whisper==1.2.1", "numpy>=1.26"]

[project.scripts]
motion-studio = "motion_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motion_studio = ["schema/*.json", "visuals/templates/*.py"]
