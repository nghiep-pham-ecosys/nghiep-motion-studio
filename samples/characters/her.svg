    <path d="M220 262 Q212 288 222 292" stroke="#c98a66" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="164" cy="296" r="15" fill="#fb7185" opacity="0.35"/>
    <circle cx="276" cy="296" r="15" fill="#fb7185" opacity="0.35"/>
    <g id="mouth-0">
      <path d="M198 318 Q220 334 242 318" stroke="#9f1239" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="mouth-1" display="none">
