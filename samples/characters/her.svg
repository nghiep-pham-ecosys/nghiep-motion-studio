    <circle cx="127" cy="290" r="7" fill="#f59e0b"/>
    <circle cx="313" cy="290" r="7" fill="#f59e0b"/>
    <ellipse cx="220" cy="252" rx="94" ry="112" fill="#f3c6a0"/>
    <path d="M124 238 C122 150 172 118 224 118 C282 118 322 152 318 232 C296 196 254 176 206 182 C172 186 144 206 124 238 Z" fill="#2b1d16"/>
