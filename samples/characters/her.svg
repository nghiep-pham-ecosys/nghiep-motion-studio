    <path d="M168 452 L220 540 L272 452 Z" fill="#e9b48f"/>
    <path d="M160 455 L220 548 L196 454 Z" fill="#f0fdfa"/>
    <path d="M280 455 L220 548 L244 454 Z" fill="#f0fdfa"/>
    <circle cx="220" cy="600" r="7" fill="#99f6e4"/>
    <circle cx="220" cy="650" r="7" fill="#99f6e4"/>
    <rect x="192" y="352" width="56" height="104" rx="22" fill="#e9b48f"/>
  </g>
  <g id="head">
    <path d="M102 362 C92 250 104 112 220 98 C336 112 348 250 338 362 C322 372 300 370 290 352 L150 352 C140 370 118 372 102 362 Z" fill="#2b1d16"/>
    <circle cx="127" cy="262" r="17" fill="#e9b48f"/>
