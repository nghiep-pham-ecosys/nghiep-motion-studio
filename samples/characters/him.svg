<svg xmlns="http://www.w3.org/2000/svg" width="440" height="700" viewBox="0 0 440 700">
  <!-- "Minh": the learner and candidate of the English lessons. Original flat character drawn for
       nghiep-motion-studio. The dialogue visual switches the groups glow, eyes-open / eyes-closed and
       mouth-0 / mouth-1 / mouth-2, and moves the group head (a nod). -->
  <g id="glow" display="none">
    <ellipse cx="220" cy="430" rx="214" ry="300" fill="#7dd3fc" opacity="0.75"/>
  </g>
  <g id="body">
    <path d="M18 700 C22 556 80 474 166 450 L274 450 C360 474 418 556 422 700 Z" fill="#1e3a8a"/>
    <path d="M176 452 L220 520 L264 452 Z" fill="#c98e62"/>
    <path d="M166 452 L206 512 L220 470 L190 446 Z" fill="#f8fafc"/>
    <path d="M274 452 L234 512 L220 470 L250 446 Z" fill="#f8fafc"/>
    <path d="M90 700 L110 600" stroke="#172554" stroke-width="6" stroke-linecap="round"/>
    <path d="M350 700 L330 600" stroke="#172554" stroke-width="6" stroke-linecap="round"/>
    <rect x="190" y="350" width="60" height="106" rx="22" fill="#c98e62"/>
  </g>
  <g id="head">
    <circle cx="128" cy="262" r="18" fill="#c98e62"/>
    <circle cx="312" cy="262" r="18" fill="#c98e62"/>
    <ellipse cx="220" cy="254" rx="92" ry="110" fill="#dba57a"/>
    <path d="M126 236 C112 148 168 104 232 108 C298 112 330 160 316 236 C306 196 290 176 262 168 C226 186 172 184 140 178 C130 196 128 214 126 236 Z" fill="#111827"/>
