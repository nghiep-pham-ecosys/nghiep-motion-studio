    <path d="M236 212 Q258 204 280 214" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g id="eyes-open">
      <ellipse cx="182" cy="250" rx="9" ry="11" fill="#1f2937"/>
      <ellipse cx="258" cy="250" rx="9" ry="11" fill="#1f2937"/>
      <circle cx="185" cy="246" r="3" fill="#ffffff"/>
      <circle cx="261" cy="246" r="3" fill="#ffffff"/>
    </g>
    <g id="eyes-closed" display="none">
      <path d="M171 252 Q182 260 193 252" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M247 252 Q258 260 269 252" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <rect x="152" y="226" width="60" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#334155" stroke-width="5"/>
    <rect x="228" y="226" width="60" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#334155" stroke-width="5"/>
    <path d="M212 246 Q220 240 228 246" stroke="#334155" stroke-width="5" fill="none"/>
    <path d="M220 266 Q212 292 224 294" stroke="#a8714c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g id="mouth-0">
      <path d="M200 320 Q220 332 240 320" stroke="#7c2d12" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="mouth-1" display="none">
      <path d="M200 316 Q220 313 240 316 Q236 337 220 338 Q204 337 200 316 Z" fill="#651a1a"/>
      <path d="M206 330 Q220 338 234 330 Q228 337 220 337 Q212 337 206 330 Z" fill="#f87171"/>
    </g>
