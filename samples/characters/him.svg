      <path d="M202 313 Q220 310 238 313 L236 320 Q220 317 204 320 Z" fill="#ffffff"/>
      <path d="M206 340 Q220 352 234 340 Q230 351 220 352 Q210 351 206 340 Z" fill="#f87171"/>
