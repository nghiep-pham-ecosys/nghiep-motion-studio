<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- No background rect: the theme background shows through. Boxes carry their own light fill, so the text reads on either theme. -->
  <g stroke-width="6">
    <rect x="80" y="370" width="360" height="160" rx="24" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="620" y="370" width="360" height="160" rx="24" fill="#d1fae5" stroke="#047857"/>
    <rect x="1160" y="370" width="360" height="160" rx="24" fill="#ffedd5" stroke="#c2410c"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="44" fill="#0f172a" text-anchor="middle">
    <text x="260" y="465">scenes.json</text>
    <text x="800" y="465">ffmpeg</text>
    <text x="1340" y="465">mp4</text>
  </g>
  <g stroke="#b45309" stroke-width="10" fill="#b45309">
    <line x1="450" y1="450" x2="590" y2="450"/>
    <polygon points="610,450 580,430 580,470"/>
    <line x1="990" y1="450" x2="1130" y2="450"/>
    <polygon points="1150,450 1120,430 1120,470"/>
  </g>
</svg>
